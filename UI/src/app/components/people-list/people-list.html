<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold">
        <i class="bi bi-people-fill text-primary me-2"></i>
        People List
      </h2>
      <p class="text-muted mb-0">
        Manage all your people records.
      </p>
    </div>

    <a routerLink="/add-person" class="btn btn-primary">
      <i class="bi bi-person-plus me-2"></i>
      Add New Person
    </a>
  </div>

  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="text-muted mt-2">Loading people...</p>
  </div>

  <div *ngIf="!isLoading() && errorMessage()" class="alert alert-danger">
    {{ errorMessage() }}

    <button
      class="btn btn-sm btn-outline-danger ms-3"
      (click)="loadPeople()">
      Retry
    </button>
  </div>

  <div *ngIf="!isLoading() && !errorMessage()"
       class="card shadow-sm border-0">

    <div class="card-header bg-white py-3">
      <h5 class="mb-0 fw-semibold">
        All People
        <span class="badge bg-primary ms-2">
          {{ people().length }}
        </span>
      </h5>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">

        <thead class="table-light">
          <tr>
            <th>Photo</th>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let person of people()">

            <td>
              <img
                [src]="getPhotoUrl(person.photoPath)"
                alt="Person Photo"
                class="person-photo">
            </td>

            <td>{{ person.id }}</td>

            <td class="fw-semibold">
              {{ person.name }}
            </td>

            <td>{{ person.age }}</td>

            <td class="text-center">

              <!-- Edit Button -->
              <a
                [routerLink]="['/update-person', person.id]"
                class="btn btn-sm btn-outline-primary me-2">
                <i class="bi bi-pencil-square"></i>
              </a>

              <!-- Delete Button -->
              <button
                class="btn btn-sm btn-outline-danger"
                (click)="deletePerson(person.id)">
                <i class="bi bi-trash"></i>
              </button>

            </td>

          </tr>

          <tr *ngIf="people().length === 0">
            <td colspan="5" class="text-center py-5 text-muted">
              <i class="bi bi-people display-5"></i>
              <p class="mt-2 mb-0">No people found.</p>
            </td>
          </tr>

        </tbody>
      </table>
    </div>

  </div>

  <div *ngIf="pendingDeleteId() !== null" class="modal-backdrop fade show"></div>
  <div
    *ngIf="pendingDeleteId() !== null"
    class="modal d-block"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="delete-person-title">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="delete-person-title" class="modal-title">Confirm deletion</h5>
          <button
            type="button"
            class="btn-close"
            aria-label="Cancel"
            (click)="cancelDelete()">
          </button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this person?
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="cancelDelete()">
            Cancel
          </button>
          <button
            type="button"
            class="btn btn-danger"
            (click)="confirmDelete()">
            Yes, delete
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
