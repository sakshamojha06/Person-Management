<div class="container mt-5">

  <div class="mb-4">
    <h2 class="fw-bold">
      <i class="bi bi-pencil-square text-primary me-2"></i>
      Update Person
    </h2>
    <p class="text-muted">
      Update the personal details below.
    </p>
  </div>

  <div *ngIf="isLoading()" class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="text-muted mt-2">Loading person details...</p>
  </div>

  <div *ngIf="!isLoading() && errorMessage() && !name()"
       class="alert alert-danger">
    {{ errorMessage() }}
  </div>

  <div *ngIf="!isLoading() && name()"
       class="card shadow-sm border-0">

    <div class="card-header bg-white py-3">
      <h5 class="mb-0 fw-semibold">Personal Details</h5>
    </div>

    <div class="card-body p-4">

      <form (ngSubmit)="saveChanges()">

        <div class="row">

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              Full Name <span class="text-danger">*</span>
            </label>

            <input
              type="text"
              class="form-control"
              name="name"
              [ngModel]="name()"
              (ngModelChange)="name.set($event)"
              placeholder="Enter full name"
              required>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">
              Age <span class="text-danger">*</span>
            </label>

            <input
              type="number"
              class="form-control"
              name="age"
              [ngModel]="age()"
              (ngModelChange)="age.set($event)"
              placeholder="Enter age"
              min="1"
              required>
          </div>

        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">
            Current Profile Photo
          </label>

          <div>
            <img
              [src]="getPhotoUrl()"
              alt="Current Profile Photo"
              class="current-photo">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">
            Change Profile Photo
          </label>

          <input
            type="file"
            class="form-control"
            accept="image/*,.heic,.heif"
            (change)="onPhotoSelected($event)">

          <small class="text-muted">
            Leave empty to keep the current photo.
          </small>

          <div *ngIf="selectedPhoto()" class="mt-2 text-success">
            <i class="bi bi-check-circle me-1"></i>
            {{ selectedPhoto()!.name }}
          </div>
        </div>

        <div *ngIf="errorMessage()" class="alert alert-danger">
          {{ errorMessage() }}
        </div>

        <div class="d-flex justify-content-end gap-2">

          <a routerLink="/people" class="btn btn-outline-secondary">
            <i class="bi bi-x-circle me-1"></i>
            Cancel
          </a>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="isSaving()">

            <span
              *ngIf="isSaving()"
              class="spinner-border spinner-border-sm me-2">
            </span>

            <i *ngIf="!isSaving()" class="bi bi-check-circle me-1"></i>

            {{ isSaving() ? 'Updating...' : 'Update Person' }}

          </button>

        </div>

      </form>

    </div>
  </div>

</div>
